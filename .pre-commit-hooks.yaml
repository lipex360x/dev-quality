- id: check-abbrev
  name: Check abbreviations
  description: Detects banned abbreviations in Python and Bash files
  entry: check-abbrev
  language: python
  types_or: [python, shell]

- id: check-comments
  name: Check comments
  description: Blocks inline and block comments in Python and Bash source files
  entry: check-comments
  language: python
  types_or: [python, shell]

- id: check-complexity
  name: Check Bash complexity
  description: Flags Bash functions exceeding cyclomatic complexity limit
  entry: check-complexity
  language: python
  types: [shell]

- id: check-noqa
  name: Check inline suppressions
  description: Rejects inline # noqa and # nosec annotations — use per-file-ignores in pyproject.toml instead
  entry: check-noqa
  language: python
  types: [python]

- id: check-repeated
  name: Check repeated lines
  description: Flags non-trivial lines repeated too many times within a single file
  entry: check-repeated
  language: python
  types_or: [python, shell]

- id: check-size
  name: Check file and function size
  description: Flags files and functions that exceed line-length limits
  entry: check-size
  language: python
  types_or: [python, shell]

- id: check-bash-tests
  name: Check Bash test coverage
  description: Ensures every Bash script has a paired test file
  entry: check-bash-tests
  language: python
  pass_filenames: false
  types: [shell]

- id: check-bash-logs
  name: Check Bash log init
  description: Ensures every Bash script calls log::init_script
  entry: check-bash-logs
  language: python
  pass_filenames: false
  types: [shell]

- id: check-all
  name: Run all quality checks
  description: Runs all checkers, ruff, mypy, shellcheck, and more. Reads .dev-quality.yaml if present.
  entry: check-all
  language: python
  pass_filenames: false
  types_or: [python, shell]
