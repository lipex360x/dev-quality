---
title: Abbreviation Rules
purpose: >
  Shared denylist/allowlist for cognitive-pause abbreviation detection.
  Used by check_abbrev.py for Python (via AST) and Bash (via regex).
  Add to denylist when a new abbreviation surfaces in code review.

denylist:
  - addr    # → address
  - arg     # → argument
  - arr     # → array
  - attr    # → attribute
  - auth    # → authentication
  - avg     # → average
  - btn     # → button
  - buf     # → buffer
  - cfg     # → config / configuration
  - cmd     # → command
  - cnt     # → count
  - col     # → column / color
  - conn    # → connection
  - creds   # → credentials
  - ctx     # → context
  - db      # → database
  - desc    # → description
  - dest    # → destination
  - dir     # → directory
  - doc     # → document
  - dst     # → destination
  - elem    # → element
  - env     # → environment
  - err     # → error
  - exc     # → exception
  - ext     # → extension
  - fmt     # → format
  - fn      # → function
  - func    # → function
  - hdr     # → header
  - hdrs    # → headers
  - idx     # → index
  - img     # → image
  - impl    # → implementation
  - info    # → information
  - lst     # → list
  - meta    # → metadata
  - mod     # → module
  - msg     # → message
  - num     # → number
  - obj     # → object
  - opts    # → options
  - param   # → parameter
  - params  # → parameters
  - perm    # → permission
  - perms   # → permissions
  - pkg     # → package
  - prop    # → property
  - props   # → properties
  - pwd     # → password
  - qry     # → query
  - qty     # → quantity
  - rec     # → record
  - ref     # → reference
  - req     # → request
  - res     # → response / result
  - resp    # → response
  - sep     # → separator
  - sess    # → session
  - src     # → source
  - tbl     # → table
  - tkn     # → token
  - tmp     # → temp / temporary
  - tok     # → token
  - uri     # → URI (Uniform Resource Identifier)
  - url     # → URL (Uniform Resource Locator)
  - usr     # → user
  - val     # → value
  - var     # → variable

allowlist:
  - self
  - cls
  - args
  - kwargs
  - i
  - j
  - k
  - _
  - id
  - ok

allowlist_sh:
  - dest    # counterpart to src in file-operation functions
